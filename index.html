            var origGet = desc.get;
            var overrideFetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: function () {
                return overrideFetch !== undefined ? overrideFetch : origGet.call(window);
              },
              set: function (v) {
                if (this === window) {
                  overrideFetch = v;
                } else {
                  Object.defineProperty(this, 'fetch', {
                    value: v,
                    writable: true,
                    enumerable: true,
                    configurable: true,
                  });
                }
              },
            });
